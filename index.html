<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>WORD SCRAMBLE RACE</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:linear-gradient(160deg,#120c3a,#2a1370);color:#fff;min-height:100vh}
.w{max-width:760px;margin:0 auto;padding:16px}.card{background:#ffffff14;border-radius:20px;padding:16px;margin:12px 0}
h1{font-size:28px;margin:8px 0;background:linear-gradient(90deg,#ffd23f,#ff4d8d);-webkit-background-clip:text;color:transparent}
input,button{font:inherit;border-radius:14px;border:0;padding:14px;width:100%;margin:6px 0}input{background:#fff;color:#111}
button{background:#ff4d8d;color:#fff;font-weight:700;cursor:pointer}button.g{background:#ffffff26}button:disabled{opacity:.4}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.tiles{display:flex;flex-wrap:nowrap;gap:4px;justify-content:center;margin:10px 0;min-height:56px}
.t{flex:1 1 0;min-width:0;max-width:52px;height:56px;font-size:26px;font-weight:800;text-transform:uppercase;background:#ffd23f;color:#222;border-radius:12px;margin:0;padding:0}
.t.used{opacity:.25}.slot{background:#4cc9f0}.msg{text-align:center;font-weight:700;min-height:26px}.bar{height:10px;background:#ffffff26;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:#4cc9f0;transition:width .3s}.big{font-size:40px;font-weight:800;text-align:center}
table{width:100%;border-collapse:collapse}td,th{padding:8px 4px;text-align:left}tr.top1{background:#ffd23f33}tr.top2{background:#cfd8dc33}tr.top3{background:#ff9f4333}
.shake{animation:s .3s}@keyframes s{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pod{display:flex;align-items:flex-end;justify-content:center;gap:8px}.pod div{flex:1;text-align:center;border-radius:12px 12px 0 0;padding:8px;background:#ffd23f;color:#222;font-weight:800}
.pop{animation:p .6s}@keyframes p{from{transform:scale(.5);opacity:0}}textarea{display:none}
</style></head><body><div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/preact/standalone.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
const SUPABASE_URL='https://bhrrdbeugbyrwfuwdaaz.supabase.co', SUPABASE_KEY='sb_publishable_wXQGiSSGwLCqQfKuQCTkBw_OnfOAZ2S'
const {html,render,useState,useEffect,useRef,useCallback}=htmPreact
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY)
let AC=null,muted=localStorage.getItem('mute')==='1'
const tone=(f,t,d,type='sine',v=.15)=>{if(muted)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain(),T=AC.currentTime+t;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,T);g.gain.exponentialRampToValueAtTime(.001,T+d);o.connect(g);g.connect(AC.destination);o.start(T);o.stop(T+d)}catch(e){}}
let spOK=false
const unlockSpeech=()=>{if(spOK||!window.speechSynthesis)return;spOK=true;try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}catch(e){}}
const say=w=>{if(muted||!window.speechSynthesis)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
const sfx={tap:()=>{unlockSpeech();tone(660,0,.06,'triangle',.1)},undo:()=>tone(440,0,.06,'triangle',.1),ok:()=>{tone(523,0,.12);tone(659,.1,.12);tone(784,.2,.2)},no:()=>{tone(220,0,.18,'sawtooth',.12);tone(180,.15,.25,'sawtooth',.12)},start:()=>[523,659,784,1046].forEach((f,i)=>tone(f,i*.1,.15,'square',.08)),win:()=>[523,659,784,659,784,1046].forEach((f,i)=>tone(f,i*.13,.22,'triangle',.15))}
const SAMPLE=[
['impression','인상','An idea or opinion of what someone or something is like.','My first impression of the new teacher was very positive.'],
['participant','참가자','A person who takes part in a particular activity.','Each participant received a certificate after the competition.'],
['estimation','추정, 평가','A guess or calculation about the cost, size, value, etc. of something.','The estimation of the project’s cost was higher than expected.'],
['pessimistic','비관적인','Thinking that bad things are more likely to happen.','She is pessimistic about the results of the test.'],
['coin','새로운 용어를 만들어 내다','To invent a new word or expression.','The scientist coined a new term to describe the phenomenon.'],
['perception','인식, 지각','A belief or opinion based on how things seem.','Our perception of the world can change through experience.'],
['underestimate','과소평가하다','To think that something is less or lower than it really is.','Never underestimate the power of teamwork.'],
['assumption','추정, 가정','Something that you accept as true without question or proof.','His decision was based on the assumption that everyone agreed.']
].map(([word,ko,def,ex])=>({word,ko,def,ex}))
const ERR={NICK_TAKEN:'That nickname is taken.',ROOM_NOT_FOUND:'Room not found.',ALREADY_STARTED:'Game already started.',NICK_EMPTY:'Enter a nickname.',NOT_HOST:'Not authorized.',INVALID_TRANSFER:'Invalid or expired transfer code.'}
const msg=e=>{const k=Object.keys(ERR).find(k=>String(e&&e.message).includes(k));return k?ERR[k]:'Something went wrong. Try again.'}
const fmt=ms=>{const s=ms/1000;return Math.floor(s/60)+':'+(s%60).toFixed(1).padStart(4,'0')}
const sortRows=r=>[...r].sort((a,b)=>(a.finish_ms==null?1:0)-(b.finish_ms==null?1:0)||(a.finish_ms||0)-(b.finish_ms||0)||(a.finished_at||'').localeCompare(b.finished_at||'')||b.progress-a.progress||a.nick.localeCompare(b.nick))

function useRoom(code){
  const [st,setSt]=useState(null),[rows,setRows]=useState([]),[online,setOnline]=useState(true)
  const load=useCallback(async()=>{
    const a=await sb.from('room_state').select('*').eq('code',code).maybeSingle()
    const b=await sb.from('board').select('*').eq('room_code',code)
    setOnline(!a.error&&!b.error);if(a.data)setSt(a.data);if(b.data)setRows(b.data)},[code])
  useEffect(()=>{load()
    const ch=sb.channel('r-'+code).on('postgres_changes',{event:'*',schema:'public',table:'board',filter:'room_code=eq.'+code},load)
      .on('postgres_changes',{event:'*',schema:'public',table:'room_state',filter:'code=eq.'+code},load).subscribe()
    const iv=setInterval(load,4000),vis=()=>document.visibilityState==='visible'&&load();document.addEventListener('visibilitychange',vis)
    return()=>{sb.removeChannel(ch);clearInterval(iv);document.removeEventListener('visibilitychange',vis)}},[code,load])
  return {st,rows,online}
}
function Board({rows,total,me}){
  const s=sortRows(rows)
  return html`<table><thead><tr><th>#</th><th>Nickname</th><th>Solved</th><th>Time</th><th>Status</th></tr></thead><tbody>
  ${s.map((r,i)=>html`<tr key=${r.id} class=${r.finish_ms!=null&&i<3?'top'+(i+1):''} style=${r.id===me?{outline:'2px solid #4cc9f0'}:{}}>
    <td>${r.finish_ms!=null&&i<3?['🥇','🥈','🥉'][i]:i+1}</td><td>${r.nick}</td><td>${r.progress}/${total}</td>
    <td>${r.finish_ms!=null?fmt(r.finish_ms):'-'}</td><td>${r.finish_ms!=null?'FINISHED':'Playing'}</td></tr>`)}</tbody></table>`
}
function Podium({rows,total}){
  const s=sortRows(rows).filter(r=>r.finish_ms!=null).slice(0,3),h=[120,90,70]
  return html`<div><div class="big pop">🏆 ${s[0]?s[0].nick:'No winner'}</div>
  <div class="pod">${[1,0,2].map(i=>s[i]&&html`<div key=${i} style=${{height:h[i]}}>${['🥇','🥈','🥉'][i]}<br/>${s[i].nick}<br/>${fmt(s[i].finish_ms)}</div>`)}</div>
  <div class="card"><${Board} rows=${rows} total=${total}/></div></div>`
}
const hashCode=()=>(location.hash.split('/')[2]||'').toUpperCase()

function Home(){
  const [code,setCode]=useState(''),[hostCode,setHostCode]=useState(''),[transferCode,setTransferCode]=useState(''),[hostErr,setHostErr]=useState('')
  const claimHost=async()=>{
    setHostErr('')
    const c=hostCode.trim().toUpperCase(),t=transferCode.trim().toUpperCase()
    if(!c||!t)return setHostErr('Enter both the room code and transfer code.')
    const {data,error}=await sb.rpc('claim_host_transfer',{p_code:c,p_transfer_code:t})
    if(error)return setHostErr(msg(error))
    localStorage.setItem('host:'+c,data)
    location.hash='#/host/'+c
  }
  return html`<div class="w"><h1>WORD SCRAMBLE RACE</h1><p>Unscramble the words. Beat the clock. Be the champion!</p>
  <div class="card"><b>Student</b><input placeholder="Room code" value=${code} onInput=${e=>setCode(e.target.value.toUpperCase())}/>
  <button disabled=${!code} onClick=${()=>{location.hash='#/join/'+code}}>JOIN</button></div>
  <div class="card"><b>Teacher</b><button class="g" onClick=${async()=>{
    const {data,error}=await sb.rpc('create_room',{p_words:SAMPLE});if(error)return alert(msg(error))
    localStorage.setItem('host:'+data.code,data.host_key);location.hash='#/host/'+data.code}}>Create new room</button>
    <div style=${{borderTop:'1px solid #ffffff30',marginTop:14,paddingTop:14}}><b>Transfer host access to this device</b>
    <input placeholder="Existing room code" maxlength="5" value=${hostCode} onInput=${e=>setHostCode(e.target.value.toUpperCase())}/>
    <input placeholder="One-time transfer code" value=${transferCode} onInput=${e=>setTransferCode(e.target.value.toUpperCase())}/>
    <button onClick=${claimHost} disabled=${!hostCode.trim()||!transferCode.trim()}>TAKE OVER EXISTING ROOM</button>
    <div class="msg">${hostErr}</div></div>
  </div></div>`
}
function Host({code}){
  const key=localStorage.getItem('host:'+code),{st,rows,online}=useRoom(code),[words,setWords]=useState(SAMPLE),[note,setNote]=useState(''),[transferCode,setTransferCode]=useState('')
  const url=location.origin+location.pathname+'#/join/'+code
  useEffect(()=>{sb.rpc('get_words',{p_code:code,p_key:key}).then(({data})=>data&&setWords(data))},[code])
  const call=async(fn,extra)=>{const {error}=await sb.rpc(fn,Object.assign({p_code:code,p_key:key},extra||{}));if(error&&String(error.message).includes('NOT_HOST')){localStorage.removeItem('host:'+code);setNote('Host access has been transferred to another device.')}else setNote(error?msg(error):'')}
  const upd=(i,k,v)=>setWords(w=>w.map((x,j)=>j===i?Object.assign({},x,{[k]:v}):x))
  const qr=useRef(null);useEffect(()=>{if(qr.current){const q=qrcode(0,'M');q.addData(url);q.make();qr.current.innerHTML=q.createSvgTag({cellSize:6,margin:3,scalable:true})}},[url,st&&st.status])
  if(!key)return html`<div class="w card">This browser is not the host of room ${code}.</div>`
  if(st&&st.status==='ended')return html`<div class="w"><h1>Final Results</h1><${Podium} rows=${rows} total=${words.length}/><button onClick=${()=>call('reset_game')}>New game (reset)</button></div>`
  return html`<div class="w"><h1>Room ${code}</h1>${!online&&html`<div class="card">Reconnecting…</div>`}
  <div class="card" style=${{textAlign:'center'}}><div class="big">${code}</div><div ref=${qr} style=${{width:240,maxWidth:'100%',margin:'0 auto',background:'#fff',borderRadius:12,padding:6}}></div>
  <button class="g" onClick=${()=>navigator.clipboard.writeText(url).then(()=>setNote('Link copied'))}>Copy join link</button></div>
  <div class="card"><b>Players connected: ${rows.length}</b></div>
  <div class="card"><b>Move host access to another computer</b><p>Generate a one-time code. Enter it with this room code on the new computer. The code expires in 10 minutes.</p>
    <button class="g" onClick=${async()=>{const {data,error}=await sb.rpc('begin_host_transfer',{p_code:code,p_key:key});if(error){setNote(msg(error));return}setTransferCode(data);setNote('Transfer code created.')}}>GENERATE TRANSFER CODE</button>
    ${transferCode&&html`<div class="big" style=${{fontSize:30,letterSpacing:4}}>${transferCode}</div><p>Use this code on the new computer. Once claimed, this browser will lose host access.</p>`}
  </div>
  ${st&&st.status==='lobby'&&html`<div class="card"><b>Vocabulary (8)</b>${words.map((w,i)=>html`<div key=${i} class="row">
    <input placeholder="English" value=${w.word} onInput=${e=>upd(i,'word',e.target.value)}/><input placeholder="한국어" value=${w.ko} onInput=${e=>upd(i,'ko',e.target.value)}/>
    <input placeholder="English definition" value=${w.def} onInput=${e=>upd(i,'def',e.target.value)}/>
    <input style=${{flex:'1 1 100%',marginBottom:14}} placeholder="Example sentence containing the word (blanked automatically)" value=${w.ex||''} onInput=${e=>upd(i,'ex',e.target.value)}/></div>`)}
    <button class="g" onClick=${()=>words.some(w=>!w.word.trim()||!w.ko.trim()||!w.def.trim())?setNote('Fill all fields.'):call('update_words',{p_words:words}).then(()=>setNote('Saved'))}>Save words</button>
    <button disabled=${!rows.length} onClick=${()=>call('start_game')}>START GAME</button></div>`}
  ${st&&st.status==='playing'&&html`<button onClick=${()=>call('end_game')}>END GAME</button>`}
  <div class="msg">${note}</div><div class="card"><${Board} rows=${rows} total=${words.length}/></div></div>`
}
function Join({code}){
  const [nick,setNick]=useState(''),[c,setC]=useState(code),[err,setErr]=useState('')
  const go=async()=>{unlockSpeech();tone(600,0,.05,'sine',.02);const {data,error}=await sb.rpc('join_room',{p_code:c,p_nick:nick});if(error)return setErr(msg(error))
    localStorage.setItem('player:'+data.code,JSON.stringify(data));location.hash='#/play/'+data.code}
  return html`<div class="w"><h1>Join the race</h1><div class="card"><input placeholder="Nickname" maxlength="12" value=${nick} onInput=${e=>setNick(e.target.value)}/>
  <input placeholder="Room code" value=${c} onInput=${e=>setC(e.target.value.toUpperCase())}/><button onClick=${go} disabled=${!nick.trim()||!c}>JOIN GAME</button><div class="msg">${err}</div>
  <p>Unscramble 8 words using the Korean meaning and English definition. Fastest total time wins!</p></div></div>`
}
function Play({code}){
  const me=JSON.parse(localStorage.getItem('player:'+code)||'null'),{st,rows,online}=useRoom(code)
  const [q,setQ]=useState(null),[pick,setPick]=useState([]),[fb,setFb]=useState(''),[shake,setShake]=useState(false),[now,setNow]=useState(Date.now()),busy=useRef(false)
  const fetchQ=useCallback(async()=>{if(!me)return;const {data}=await sb.rpc('get_question',{p_token:me.token});if(data){setQ(data);setPick([])}},[])
  useEffect(()=>{fetchQ()},[st&&st.status]);useEffect(()=>{const i=setInterval(()=>setNow(Date.now()),100);return()=>clearInterval(i)},[])
  const letters=(q&&q.letters)||[]
  const submit=useCallback(async()=>{if(busy.current||!q||q.idx==null)return;busy.current=true
    const ans=pick.map(i=>letters[i]).join(''),{data,error}=await sb.rpc('submit_answer',{p_token:me.token,p_idx:q.idx,p_ans:ans})
    if(error)setFb('Connection problem. Try again.')
    else if(data.ok){sfx.ok();say(ans);setFb('Correct! Great job! ✅ '+ans);setTimeout(()=>{setFb('');busy.current=false;fetchQ()},700);return}
    else{sfx.no();setFb('Not quite! Try again!');setShake(true);setTimeout(()=>setShake(false),300)}
    busy.current=false},[pick,q])
  useEffect(()=>{const h=e=>{if(e.key==='Enter')return submit()
    if(e.key==='Backspace')return setPick(p=>p.slice(0,-1))
    if(/^[a-z]$/i.test(e.key))setPick(p=>{const i=letters.findIndex((l,j)=>l===e.key.toLowerCase()&&!p.includes(j));return i<0?p:[...p,i]})}
    window.addEventListener('keydown',h);return()=>window.removeEventListener('keydown',h)},[letters.join(''),submit])
  const [mu,setMu]=useState(muted),fin=rows.some(r=>me&&r.id===me.id&&r.finish_ms!=null)
  useEffect(()=>{if(st&&st.status==='playing')sfx.start()},[st&&st.status]);useEffect(()=>{if(fin)sfx.win()},[fin])
  if(!me)return html`<div class="w card">Please join first.</div>`
  const fs=Math.max(12,Math.min(26,Math.floor((Math.min(window.innerWidth,760)-40)/Math.max(letters.length,1)*0.55))),total=(q&&q.total)||8,rank=sortRows(rows).findIndex(r=>r.id===me.id)+1,mine=rows.find(r=>r.id===me.id)
  const head=html`<div class="row"><b>${me.nick}</b><b>Rank #${rank||'-'}</b><button class="g" style=${{flex:'0 0 56px',margin:0,padding:8}} onClick=${()=>{muted=!muted;localStorage.setItem('mute',muted?'1':'0');setMu(muted);sfx.tap()}}>${mu?'🔇':'🔊'}</button>${!online&&html`<b>Reconnecting…</b>`}</div>`
  if(st&&st.status==='ended')return html`<div class="w">${head}<${Podium} rows=${rows} total=${total}/></div>`
  if(!st||st.status==='lobby')return html`<div class="w">${head}<h1>Waiting for the teacher…</h1><div class="card">${rows.length} players in the lobby</div></div>`
  if((q&&q.done)||(mine&&mine.finish_ms!=null))return html`<div class="w">${head}<h1 class="pop">FINISHED! 🎉</h1><div class="big">${fmt((mine&&mine.finish_ms)||(q&&q.finish_ms)||0)}</div>
    <div class="card"><${Board} rows=${rows} total=${total} me=${me.id}/></div></div>`
  if(!q||!q.letters)return html`<div class="w">Loading…</div>`
  const elapsed=q.started_at?now-new Date(q.started_at).getTime():0
  return html`<div class="w">${head}<div class="big">${fmt(Math.max(0,elapsed))}</div>
  <div class="bar"><i style=${{width:(q.idx/total*100)+'%'}}></i></div><p>Question ${q.idx+1}/${total}</p>
  <div class="card"><div style=${{fontSize:24,fontWeight:800}}>${q.ko}</div><div>${q.def}</div>${q.ex&&html`<div style=${{marginTop:8,fontStyle:'italic',color:'#ffd23f'}}>“${q.ex}”</div>`}</div>
  <div class=${'tiles '+(shake?'shake':'')}>${pick.map((i,k)=>html`<button key=${k} class="t slot" style=${{fontSize:fs}} onClick=${()=>{sfx.undo();setPick(p=>p.filter((_,j)=>j!==k))}}>${letters[i]}</button>`)}${!pick.length&&html`<span>Tap letters below</span>`}</div>
  <div class="tiles">${letters.map((l,i)=>html`<button key=${i} class=${'t'+(pick.includes(i)?' used':'')} style=${{fontSize:fs}} disabled=${pick.includes(i)} onClick=${()=>{sfx.tap();setPick(p=>[...p,i])}}>${l}</button>`)}</div>
  <div class="msg">${fb}</div><div class="row"><button class="g" onClick=${()=>{sfx.undo();setPick([])}}>Reset</button><button onClick=${submit} disabled=${pick.length!==letters.length}>Submit</button></div></div>`
}
function App(){
  const [h,setH]=useState(location.hash);useEffect(()=>{const f=()=>setH(location.hash);window.addEventListener('hashchange',f);return()=>window.removeEventListener('hashchange',f)},[])
  const code=hashCode()
  if(h.startsWith('#/host/'))return html`<${Host} key=${code} code=${code}/>`
  if(h.startsWith('#/join/'))return html`<${Join} code=${code}/>`
  if(h.startsWith('#/play/'))return html`<${Play} key=${code} code=${code}/>`
  return html`<${Home}/>`
}
render(html`<${App}/>`,document.getElementById('root'))
</script></body></html>
